[project]
name = "kafka-mcp"
version = "0.1.0"
description = "Read-only MCP server for the local Kafka + Schema Registry (topics, AVRO-decoded messages, subjects)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mcp==2.3.0",
    "confluent-kafka[avro]==2.16.0",
]

[project.scripts]
kafka-mcp = "kafka_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kafka_mcp"]
