# PostgreSQL configuration for the WPDB stack (postgres:16).
# Loaded with `postgres -c config_file=/etc/postgresql/postgresql.conf`; every
# setting not listed here keeps its compiled-in default. pg_hba.conf stays the
# image default ($PGDATA/pg_hba.conf: host all all all scram-sha-256), which also
# covers replication connections from the `debezium` role.

listen_addresses = '*'           # the image's entrypoint would set this in $PGDATA/postgresql.conf;
                                 # with an external config file it has to be explicit

# --- Logical replication for Debezium (docs/design/02-postgresql.md §1, §5) ---
wal_level = logical              # WAL carries row images for pgoutput
max_replication_slots = 4        # 1 for Debezium + headroom for a re-created slot
max_wal_senders = 4
max_slot_wal_keep_size = 2GB     # an idle slot (Connect down) cannot fill the Docker disk:
                                 # above this the slot is invalidated and Debezium re-snapshots

# --- Laptop tuning (02 §9); the stack shares ~10 GB of RAM with Kafka and Spark ---
shared_buffers = 256MB           # 1 GB container limit; data set is a few hundred MB
max_wal_size = 1GB               # fewer forced checkpoints during the replay bursts
wal_compression = on             # REPLICA IDENTITY FULL doubles row images; compress them
checkpoint_completion_target = 0.9
