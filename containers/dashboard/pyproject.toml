[project]
name = "wpdb-dashboard"
version = "0.1.0"
description = "WPDB Streamlit dashboard: reads the gold and ops Delta tables in MinIO (docs/design/07-dashboard.md)"
requires-python = ">=3.12,<3.13"
# versions: docs/design/08-operations.md §1 (the root pyproject pins the same ones for tests)
dependencies = [
    "streamlit==1.66.1",
    "plotly==7.1.0",
    "deltalake==1.6.6",
    "duckdb==1.5.6",
    "pyarrow==25.0.1",
    "pandas==3.0.6",
    "numpy==2.5.3",
]

[tool.uv]
package = false
