[project]
name = "wpdb-platform"
version = "0.1.0"
description = "WPDB mini data platform: root project for tests and shared tooling (uv)"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-timeout==2.4.0",
    "psycopg[binary]==3.3.6",
    "confluent-kafka[avro]==2.16.0",
    "requests==2.34.2",
    "boto3==1.43.115",
    "python-dotenv==1.2.4",
    "pyyaml==6.0.3",
    "ruff==0.17.1",
    # stage 3: Spark unit tests (local SparkSession + Delta on the local FS) and the
    # Delta readers used by the integration tests (delta-rs, DuckDB); 08 §1
    "pyspark==3.5.9",
    "delta-spark==3.3.3",
    "deltalake==1.6.6",
    "duckdb==1.5.6",
    "pyarrow==25.0.1",
    "pytz==2026.5",  # DuckDB returns TIMESTAMP WITH TIME ZONE as tz-aware datetimes
    # stage 4: the dashboard's query layer and streamlit.testing.AppTest run on the host
    # with the same pins as containers/dashboard/pyproject.toml (08 §1)
    "streamlit==1.66.1",
    "plotly==7.1.0",
    "pandas==3.0.6",
    "numpy==2.5.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# the component packages are importable in unit tests without installing them
pythonpath = ["containers/simulator", "containers/consumer", "containers/spark", "containers/dashboard"]
addopts = "--strict-markers -ra"
timeout = 600
markers = [
    "unit: no Docker, pure logic (make test-unit)",
    "integration: needs a subset of containers, started by the fixtures (make test-integration)",
    "e2e: full stack, fresh, including fault injection (make test-e2e)",
    "slow: takes more than a minute; deselect with -m 'not slow'",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["data", "docs", ".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["consumer", "dashboard", "lakehouse", "simulator", "tests"]
